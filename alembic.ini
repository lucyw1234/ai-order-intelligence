[alembic]
script_location = alembic
sqlalchemy.url = %(DATABASE_URL)s

[post_write_hooks]
hooks = prevent_file_on_windows
prevent_file_on_windows.type = console
prevent_file_on_windows.entrypoint = python
prevent_file_on_windows.options = -c "import sys; assert sys.platform != 'win32', 'Alembic migrations should not be run directly on Windows for production deployments'"